[package]
name = "wavnotes"
version = "0.1.0"
description = "A personal listening notebook"
authors = ["wavNotes"]
edition = "2021"

[lib]
name = "wavnotes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
